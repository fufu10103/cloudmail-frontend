# 安全响应头（被 nginx.conf 里每个 location 重复 include）
# 关键点：nginx 的 add_header 不会跨层级继承 —— 一旦某个 location 里出现了
# add_header，server 级声明的所有 add_header 都会对该 location 失效。
# 所以这些头必须在每个 location 内部 include，而不是只写在 server 级。
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# CSP 先观察（只上报不拦截）。在 DevTools 控制台确认没有误伤 Next.js 运行脚本、
# 以及邮件正文的 srcdoc iframe 之后，再把下面的 Report-Only 改成 Content-Security-Policy。
# style-src 需要 'unsafe-inline'：React 的行内 style 属性属于 style-src-attr。
# frame-src 用 'self' 而不是 'none'：邮件正文用 srcdoc iframe 渲染，留空会连它一起挡掉。
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; font-src 'self'; connect-src 'self' https:; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# 站点启用 HTTPS 后再打开 HSTS（放在 TLS 终止的那一层也可以）：
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;